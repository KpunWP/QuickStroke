name: JSSF closed-stage smoke

on:
  push:
    branches:
      - fix/jssf-public-sticky-v6
      - research/face-p0-data-contract-20261003
    paths:
      - .github/workflows/jssf-closed-smoke.yml
      - tests/jssf-remote-*.mjs
      - js/jssf-remote-sync.js
      - js/data-contract.js
      - supabase/functions/jssf-remote-ingest/**
      - supabase/migrations/**
      - face-test.html
      - config.js
      - tests/face-baseline-hardening.mjs
      - tests/face-closed-smile-path.mjs
      - tests/face-dynamic-asymmetry-shadow.mjs
      - tests/face-pose-hardening.mjs
      - tests/face-mouth-visibility-hardening.mjs
      - tests/face-distance-gate.mjs
      - tests/face-early-safety-path.mjs
      - docs/FACE_P0_RESEARCH_AUDIT.md
      - tests/face-research-export.mjs
      - research/jssf-face-export.mjs
      - tests/run-tests.mjs
      - jssf-consent.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-closed-staging:
    name: Privacy, offline sync and live disabled-API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inactive mode isolation and staged payload
        run: |
          node tests/jssf-remote-client.mjs
          node tests/jssf-remote-staging.mjs
          node tests/jssf-face-research-contract.mjs
          node tests/face-baseline-hardening.mjs
          node tests/face-closed-smile-path.mjs
          node tests/face-dynamic-asymmetry-shadow.mjs
          node tests/face-pose-hardening.mjs
          node tests/face-mouth-visibility-hardening.mjs
          node tests/face-distance-gate.mjs
          node tests/face-early-safety-path.mjs
          node tests/face-research-export.mjs
          node tests/run-tests.mjs
          node tests/jssf-retention-static.mjs
      - name: Exercise synthetic offline retry and idempotency
        run: node tests/jssf-remote-sync-flow.mjs
      - name: Check real Supabase API is CLOSED and refuses enrollment
        run: node tests/jssf-remote-http-smoke.mjs
