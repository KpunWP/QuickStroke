name: Arm P0 branch validation

on:
  push:
    branches:
      - research/arm-p0-ab-20261003
      - research/arm-p0-c-replay-20261003
      - research/arm-p0-d-dynamics-20261003
      - research/arm-p0-e-device-browser-20261003
      - research/arm-p0-f-e2e-audit-20261003
      - research/arm-persistent-guide-20261005
      - research/arm-guide-step3-tts-20261005
      - research/arm-lang-freeze-hotfix-20261005
      - research/arm-guide-segmented-20261005
      - research/jssf-completion-tts-20261005
      - research/arm-progressive-guide-20261005
      - research/arm-clean-assets-tts-20261005
      - research/arm-retry-flow-framing-20261005
      - research/arm-six-assets-flow-copy-20261005
      - research/arm-image-integrity-short-copy-20261005
      - research/arm-css-image-debug-20261005
      - research/arm-thai-voice-copy-20261005
      - research/arm-p0-start-transient-20261007
      - fix/jssf-session-lifecycle-recovery
      - fix/arm-speech-voice-cues-20261006
      - fix/ios-first-cue-retry-history-20261006
      - fix/arm-cue-after-navigation-20261006
      - cleanup/remove-passive-arm-confirmation-cue-20261006
      - copy/result-thai-wording-20261006
      - research/jssf-p0-arm-speech-thai-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Core regression suite
        run: node tests/run-tests.mjs
      - name: Remote client contract
        run: node tests/jssf-remote-client.mjs
      - name: Arm remote sanitizer contract
        run: node tests/arm-p0-remote-contract.mjs
      - name: Deterministic Arm sensor replay
        run: node tests/arm-sensor-replay.mjs
      - name: Arm dynamics and duration replay
        run: node tests/arm-dynamics-duration.mjs
      - name: Arm device/browser hardening
        run: node tests/arm-device-browser-hardening.mjs
      - name: Arm research E2E audit
        run: node tests/arm-research-e2e-audit.mjs
      - name: Arm guide persistence UX regression
        run: node tests/arm-guide-persistence.mjs
      - name: JSSF terminal result UX regression
        run: node tests/jssf-result-completion-ux.mjs
      - name: JSSF session lifecycle regression
        run: node tests/jssf-session-lifecycle-regression.mjs
      - name: Arm/Speech voice cue regression
        run: node tests/voice-cue-flow.mjs
      - name: Inline script syntax
        run: python3 tests/check-inline-scripts.py
