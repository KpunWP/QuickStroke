name: Speech P0 branch validation

on:
  push:
    branches:
      - research/speech-p0-20261004
      - research/speech-mic-user-gesture-20261005
      - research/speech-resume-persistence-audio-20261005
      - fix/arm-speech-voice-cues-20261006
      - fix/ios-first-cue-retry-history-20261006
      - fix/arm-cue-after-navigation-20261006
      - cleanup/remove-passive-arm-confirmation-cue-20261006
      - copy/result-thai-wording-20261006
      - research/face-remote-telemetry
      - fix/android-tts-readiness-20261007
      - fix/pilot-config-freshness-20261007
      - fix/thai-tts-english-fallback-20261007
      - research/jssf-p0-arm-speech-thai-20261008
      - research/thai-audio-ab-20261009
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speech-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Core regression suite
        run: node tests/run-tests.mjs
      - name: Remote client contract
        run: node tests/jssf-remote-client.mjs
      - name: Face remote Edge HTTP contract
        run: node tests/jssf-edge-handler-http-e2e.mjs
      - name: Speech remote sanitizer contract
        run: node tests/speech-p0-remote-contract.mjs
      - name: Deterministic Speech ASR replay
        run: node tests/speech-asr-replay.mjs
      - name: Speech timing and rate replay
        run: node tests/speech-timing-rate-replay.mjs
      - name: Speech device/browser hardening
        run: node tests/speech-device-browser-hardening.mjs
      - name: Speech research E2E audit
        run: node tests/speech-research-e2e-audit.mjs
      - name: JSSF consent v2 contract
        run: node tests/jssf-consent-v2-contract.mjs
      - name: JSSF provenance contract
        run: node tests/jssf-provenance-contract.mjs
      - name: JSSF result completion UX
        run: node tests/jssf-result-completion-ux.mjs
      - name: JSSF mobile-only gate
        run: node tests/jssf-mobile-only-gate.mjs
      - name: Arm post-task understanding
        run: node tests/arm-post-task-understanding.mjs
      - name: Arm remote sanitizer contract
        run: node tests/arm-p0-remote-contract.mjs
      - name: Arm research E2E audit
        run: node tests/arm-research-e2e-audit.mjs
      - name: Arm device/browser hardening
        run: node tests/arm-device-browser-hardening.mjs
      - name: Android compatibility
        run: node tests/android-compat.mjs
      - name: TTS readiness contract
        run: node tests/tts-readiness-contract.mjs
      - name: Arm/Speech voice cue regression
        run: node tests/voice-cue-flow.mjs
      - name: Inline script syntax
        run: python3 tests/check-inline-scripts.py
