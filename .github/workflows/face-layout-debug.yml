name: Face layout diagnostics
on:
  pull_request:
    branches:
      - diagnostics/public-face-layout-20261026
      - fix/public-face-camera-countdown-final-20261026
    paths:
      - face-test.html
      - api/face-layout-debug-gate.js
      - js/face-layout-debug.js
      - tests/face-layout-debug.*
      - tests/face-layout-summary.mjs
      - tests/fixtures/face-layout-summary.mjs
      - tests/public-face-*.mjs
      - .github/workflows/face-layout-debug.yml
permissions:
  contents: read
jobs:
  diagnostic-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview gate, privacy and frozen application contracts
        run: |
          node tests/face-layout-debug.mjs
          node tests/face-layout-summary.mjs
          node tests/public-face-ui.mjs
          node tests/public-face-active.mjs
          node tests/public-face-startup.mjs
          node tests/public-face-completion-panel.mjs
          node tests/face-capture-contract.mjs
          node tests/run-tests.mjs
          node tests/public-language-continuity.mjs
          python3 tests/check-inline-scripts.py
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/layout-browser" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/layout-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Public-only snapshots, geometry, caps, clipboard and privacy
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/layout-browser/node_modules/playwright
        run: node tests/face-layout-debug.cjs
