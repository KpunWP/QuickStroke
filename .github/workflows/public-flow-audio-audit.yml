name: Public Full and Individual flow/audio audit

on:
  push:
    branches:
      - research/jssf2026-public-flow-audio-audit-20261018
  pull_request:
    branches:
      - research/jssf-2026-poster-demo-kickoff-20261018
      - main

permissions:
  contents: read

jobs:
  public-flow-audio-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Public Full/Individual and TH EN JA cue wiring
        run: node tests/public-flow-audio-audit.mjs
      - name: Public-only and staff-mode entry routes
        run: node tests/public-entry-landing.mjs
      - name: Public iPhone speaker-first mic and ASR handoff
        run: node tests/public-ios-speaker-first.mjs
      - name: Public opt-in TTS trial and Japanese Arm speech contract
        run: node tests/public-tts-uat.mjs
      - name: Existing core frozen algorithms and policy tests
        run: node tests/run-tests.mjs
      - name: Existing voice, device and public safety regressions
        run: |
          node tests/voice-cue-flow.mjs
          node tests/arm-guide-persistence.mjs
          node tests/speech-device-browser-hardening.mjs
          node tests/tts-readiness-contract.mjs
          node tests/tts-pronunciation.mjs
          node tests/public-sticky-regression.mjs
          node tests/jssf-result-completion-ux.mjs
      - name: Inline JavaScript syntax
        run: python3 tests/check-inline-scripts.py
