       finalizeButton.textContent = 'Session finalized แล้ว';
       exportButton.disabled = false;
       if (status) status.textContent = '';
       return;
     }
     let integrity = null;
     try {
       integrity = await RESULT_RESEARCH_STORE.validateSessionIntegrity(session.screeningSessionId, {
         requireProtocolComplete:true,
         requireResearch:true
       });
     } catch (error) {
       integrity = { canFinalize:false, errors:[error.message || String(error)], warnings:[] };
     }
     const errors = integrity?.errors || [];
     const warnings = integrity?.warnings || [];
     box.className = `integrity-box ${integrity?.canFinalize ? 'ok' : 'error'}`;
     box.innerHTML = '';
     const summary = document.createElement('div');
     summary.textContent = integrity?.canFinalize
       ? `Integrity ผ่าน · ${integrity.counts?.moduleRuns ?? 0} module runs · ${integrity.counts?.testAttempts ?? 0} attempts`
       : `Integrity ยังไม่ผ่าน (${errors.length} error${errors.length === 1 ? '' : 's'})`;
     box.appendChild(summary);
     if (errors.length || warnings.length) {
       const list = document.createElement('ul'); list.className = 'integrity-list';
       [...errors.map((value) => `ERROR: ${value}`), ...warnings.slice(0,5).map((value) => `WARN: ${value}`)].forEach((value) => {
         const item = document.createElement('li'); item.textContent = value; list.appendChild(item);
       });
       box.appendChild(list);
     }
     finalizeButton.textContent = 'จบการเก็บข้อมูลผู้เข้าร่วมรายนี้';
     finalizeButton.disabled = !integrity?.canFinalize || session.sessionStatus !== 'protocol_completed';
     exportButton.disabled = false;
     if (status) status.textContent = session.sessionStatus === 'active'
       ? 'ต้องทำ Face, Arm และ Speech ครบตาม protocol ก่อน finalize'
       : integrity?.canFinalize ? 'พร้อม finalize' : 'กรุณาแก้ integrity errors ก่อน finalize';
   }

   async function buildResult() {
     if (!T) return;
     await ensureResultDataContext();
     CURRENT = calculate();
     renderSummary(CURRENT);
     renderModules(CURRENT);
     renderNext(CURRENT);
     renderReminder(CURRENT);
     renderResearch(CURRENT);
     await renderResearchFinalization(CURRENT);
     renderDevDiagnostics(CURRENT);
     renderActions(CURRENT);
     void persistResultDecisionTrace(CURRENT)
   }

   function retryModule(name) {
     const sessionStatus = RESULT_DATA_CONTEXT?.session?.sessionStatus || RESULT_CONTRACT?.getSessionContext?.()?.sessionStatus;
     if (sessionStatus === 'finalized') { alert('Session นี้ finalize แล้ว ไม่สามารถ retry ได้'); return; }
     if (!canRetryModule(name)) return;
     if (isPublicResultSession()) rememberPublicAbnormal(name, CURRENT?.data?.[name]);
     const researchSelection = isResearchResultSession() ? researchProtocolSelectionStatus(name) : null;
     const currentRunId = CURRENT?.data?.[name]?.moduleRunId || null;
     const canonicalSessionMode = RESULT_DATA_CONTEXT?.session?.sessionMode || null;
     const storedSessionMode = sessionStorage.getItem('fast_mode');
     const sessionMode = canonicalSessionMode === 'full' || storedSessionMode === 'full'
       ? 'full'
       : 'individual';

     sessionStorage.removeItem(`fast_${name}`);
     const retryRequestedAt = new Date().toISOString();
     const identity = currentSessionIdentity();
     if (RESULT_RESEARCH_STORE?.addTechnicalEvent && RESULT_CONTRACT && identity.screeningSessionId) {
       void RESULT_RESEARCH_STORE.addTechnicalEvent({
         technicalEventId:RESULT_CONTRACT.createId('technicalEvent'),
         recordType:'technical_event',
         schemaVersion:RESULT_CONTRACT.versions?.technicalEventSchema || 'technical-event-0.1.0',
         participantId:identity.participantId,
         screeningSessionId:identity.screeningSessionId,
         legacyAssessmentId:RESULT_CONTRACT.getSessionContext?.().legacyAssessmentId || null,
         module:name,
         moduleRunId:currentRunId,
         testAttemptId:null,
         eventCode:'MODULE_RETRY_REQUESTED',
         category:'retry_lifecycle',
         severity:'info',
         phase:'RESULT_ACTION',
         occurredAt:retryRequestedAt,
         recordedAt:retryRequestedAt,
         sourceComponent:'result-page',
         sourceVersion:RESULT_DIAGNOSTIC_VERSION,
         recovered:false,
         details:{
           sessionMode,
           previousModuleRunId:currentRunId,
           protocolSelectionEligibleForNextRun:researchSelection?.protocolSelectionEligible ?? null,
           nextProtocolPhase:researchSelection?.protocolPhase ?? null,
           protocolSelectionRunLimit:researchSelection?.configuredLimit ?? null
         },
         versionSnapshot:RESULT_CONTRACT.createVersionSnapshot?.(name) || null
       }).catch(error => console.warn('Unable to persist retry technical event.', error));
     }
     sessionStorage.setItem('fast_pending_module_retry', JSON.stringify({
       module: name,
       previousModuleRunId: currentRunId,
       previousModuleRunSequenceNo: CURRENT?.data?.[name]?.moduleRunSequenceNo || null,
       currentModuleRunIdAtRequest: RESULT_CONTRACT?.getCurrentModuleRunId?.(name) || null,
       requestedAt: retryRequestedAt,
       sessionMode,
       resultScope: sessionMode === 'full' ? 'combined' : 'individual'
     }));
     sessionStorage.setItem('fast_mode', sessionMode);
     if (sessionMode === 'full') {
       sessionStorage.removeItem('fast_result_source');
     } else {
       sessionStorage.setItem('fast_result_source', name);
     }
     sessionStorage.setItem('fast_lang', LANG);
     location.href = `${name}-test.html`;
   }

   function nextModule() {
     return CURRENT?.invalid[0] || CURRENT?.missing[0] || 'face';
   }

   function continueTests() {
     const sessionStatus = RESULT_DATA_CONTEXT?.session?.sessionStatus || RESULT_CONTRACT?.getSessionContext?.()?.sessionStatus;
     if (sessionStatus === 'finalized') { alert('Session นี้ finalize แล้ว กรุณาเริ่มผู้เข้าร่วมรายใหม่'); return; }
     sessionStorage.setItem('fast_mode', 'full');
     sessionStorage.removeItem('fast_result_source');
     sessionStorage.setItem('fast_lang', LANG);
     location.href = `${nextModule()}-test.html`;
   }

   function retryAll() {
     const sessionStatus = RESULT_DATA_CONTEXT?.session?.sessionStatus || RESULT_CONTRACT?.getSessionContext?.()?.sessionStatus;
     if (sessionStatus === 'finalized') { alert('Session นี้ finalize แล้ว ไม่สามารถ retry ได้'); return; }
     if (!T || !confirm(T.retryConfirm)) {
       return;
     }
     if (isPublicResultSession() && CURRENT?.data) {
       MODULES.forEach(name => rememberPublicAbnormal(name, CURRENT.data[name]));
     }

     [
       'fast_face',
       'fast_arm',
       'fast_speech',
       'fast_mode',
       'fast_result_source',
       'fast_pending_module_retry',
       'fast_result_decision_trace',
       'fast_result_decision_trace_hash'
     ].forEach(key => {
       sessionStorage.removeItem(key);
     });

     sessionStorage.setItem('fast_lang', LANG);
     location.href = 'index.html';
   }

   function goHome() {
     sessionStorage.removeItem('fast_result_source');
     location.href = 'index.html';
   }

   async function resultSwitchLang(c) {
     await loadResultLanguage(c, {
       persist: true
     })
   }
   window.resultSwitchLang = resultSwitchLang;
   (async () => {
     const s = savedLang(),
       c = RESULT_LOCALE_MAP[s] ? s : 'th';
     if (!await loadResultLanguage(c, {
         persist: false
       })) throw new Error('Result language initialization failed')
   })().catch(e => {
     console.error(e);
     document.getElementById('summary-title').textContent = 'Language unavailable'
   });
  </script>
  <script>
   if ('serviceWorker' in navigator) {
     addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(e =>
       console.error(e)))
   }
  </script>
 </body>
