<!DOCTYPE html>
<html lang="th">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
  <title>
   QuickStroke · ผลการคัดกรอง
  </title>
  <link href="/manifest.webmanifest" rel="manifest"/>
  <meta content="#176FD1" name="theme-color"/>
  <meta content="QuickStroke" name="apple-mobile-web-app-title"/>
  <link href="/icons/icon-192.png" rel="apple-touch-icon"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
   :root {
     --paper: #F3F6FA;
     --surface: #fff;
     --ink: #142235;
     --ink-soft: #526377;
     --muted: #76869A;
     --blue: #176FD1;
     --blue-deep: #0B55AD;
     --blue-soft: #EAF3FE;
     --green: #137F6D;
     --green-soft: #E9F7F3;
     --amber: #9A5C09;
     --amber-soft: #FFF3DD;
     --red: #C93D38;
     --red-soft: #FDEDEC;
     --neutral-soft: #EEF2F6;
     --line: #D7E0E9;
     --shadow: 0 10px 28px rgba(20, 34, 53, .08);
     --r: 24px;
   }

   * {
     box-sizing: border-box;
     margin: 0;
     padding: 0;
     -webkit-tap-highlight-color: transparent
   }

   html {
     min-height: 100%;
     background: #E7EDF4
   }

   body {
     min-height: 100dvh;
     background: var(--paper);
     color: var(--ink);
     font-family: 'IBM Plex Sans Thai', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
     line-height: 1.45;
     overflow-x: hidden
   }

   button {
     font: inherit
   }

   button:focus-visible,
   summary:focus-visible {
     outline: 3px solid rgba(23, 111, 209, .28);
     outline-offset: 3px
   }

   header {
     position: sticky;
     top: 0;
     z-index: 20;
     min-height: 62px;
     padding: 9px 16px;
     display: flex;
     align-items: center;
     justify-content: space-between;
     gap: 12px;
     background: rgba(243, 246, 250, .97);
     border-bottom: 1px solid var(--line);
     backdrop-filter: blur(12px);
     -webkit-backdrop-filter: blur(12px)
   }

   .brand {
     display: flex;
     align-items: center;
     gap: 9px
   }

   .brand-mark {
     width: 40px;
     height: 40px;
     border-radius: 14px;
     display: flex;
     align-items: center;
     justify-content: center;
     background: linear-gradient(180deg, #2388FF, var(--blue-deep));
     box-shadow: 0 8px 20px rgba(23, 111, 209, .20)
   }

   .brand-mark svg {
     width: 22px;
     height: 22px;
     fill: none;
     stroke: #fff;
     stroke-width: 2.3;
     stroke-linecap: round;
     stroke-linejoin: round
   }

   .brand-text {
     font-family: 'Manrope';
     font-size: 18px;
     font-weight: 800;
     letter-spacing: -.2px
   }

   .brand-text strong {
     color: var(--blue)
   }

   .lang-seg {
     display: flex;
     gap: 3px;
     padding: 4px;
     border-radius: 16px;
     background: #fff;
     border: 1px solid var(--line)
   }

   .lang-seg button {
     height: 38px;
     min-width: 42px;
     padding: 0 8px;
     border: 0;
     border-radius: 12px;
     background: transparent;
     color: var(--muted);
     font-family: 'Manrope';
     font-size: 14px;
     font-weight: 800;
     cursor: pointer
   }

   .lang-seg button.active {
     background: var(--blue);
     color: #fff
   }

   .lang-seg button:active {
     transform: scale(.97)
   }

   main {
     width: 100%;
     max-width: 480px;
     margin: 0 auto;
     padding: 14px 14px 24px
   }

   .summary-card {
     position: relative;
     overflow: hidden;
     background: #fff;
     border: 1.5px solid var(--line);
     border-radius: 26px;
     box-shadow: var(--shadow)
   }

   .summary-accent {
     height: 6px;
     background: var(--blue)
   }

   .summary-body {
     padding: 18px
   }

   .summary-main {
     display: grid;
     grid-template-columns: 108px minmax(0, 1fr);
     gap: 16px;
     align-items: center
   }

   .metric {
     min-height: 108px;
     border-radius: 22px;
     display: flex;
     flex-direction: column;
     align-items: center;
     justify-content: center;
     background: var(--blue-soft);
     color: var(--blue-deep);
     text-align: center;
     padding: 9px
   }

   .metric-value {
     font-family: 'Manrope';
     font-size: 43px;
     font-weight: 800;
     line-height: 1;
     letter-spacing: -1.7px
   }

   .metric-label {
     font-size: 15px;
     font-weight: 800;
     line-height: 1.2;
     margin-top: 7px
   }

   .summary-kicker {
     font-size: 14px;
     font-weight: 800;
     color: var(--muted);
     margin-bottom: 4px
   }

   .summary-title {
     font-size: clamp(25px, 6.7vw, 30px);
     font-weight: 800;
     line-height: 1.15;
     letter-spacing: -.4px
   }

   .summary-desc {
     font-size: 16.5px;
     font-weight: 650;
     color: var(--ink-soft);
     line-height: 1.4;
     margin-top: 7px
   }

   .completion {
     font-size: 15.5px;
     font-weight: 800;
     color: var(--blue-deep);
     margin-top: 7px
   }

   .summary-card.ok .summary-accent {
     background: var(--green)
   }

   .summary-card.ok .metric {
     background: var(--green-soft);
     color: var(--green)
   }

   .summary-card.review .summary-accent {
     background: var(--amber)
   }

   .summary-card.review .metric {
     background: var(--amber-soft);
     color: var(--amber)
   }

   .summary-card.urgent .summary-accent {
     background: var(--red)
   }

   .summary-card.urgent .metric {
     background: var(--red-soft);
     color: var(--red)
   }

   .summary-card.incomplete .summary-accent,
   .summary-card.noData .summary-accent {
     background: var(--blue)
   }

   .emergency-action {
     margin-top: 15px
   }

   .emergency-call {
     width: 100%;
     min-height: 58px;
     border: 0;
     border-radius: 18px;
     padding: 11px 16px;
     display: flex;
     align-items: center;
     justify-content: center;
     gap: 10px;
     background: var(--red);
     color: #fff;
     font-size: 20px;
     font-weight: 800;
     cursor: pointer;
     box-shadow: 0 9px 20px rgba(201, 61, 56, .20)
   }

   .emergency-call svg {
     width: 23px;
     height: 23px;
     fill: none;
     stroke: #fff;
     stroke-width: 2.2;
     stroke-linecap: round;
     stroke-linejoin: round
   }

   .emergency-call:active {
     transform: scale(.985)
   }

   .emergency-local {
     min-height: 58px;
     border-radius: 18px;
     padding: 12px 15px;
     display: flex;
     align-items: center;
     justify-content: center;
     background: var(--red);
     color: #fff;
     font-size: 18px;
     font-weight: 800;
     text-align: center
   }

   .module-grid {
     display: grid;
     grid-template-columns: repeat(3, minmax(0, 1fr));
     gap: 8px;
     margin-top: 12px
   }

   .module-tile {
     min-height: 124px;
     padding: 12px 7px 10px;
     border-radius: 20px;
     border: 1.5px solid var(--line);
     background: #fff;
     text-align: center;
     color: var(--ink);
     display: flex;
     flex-direction: column;
     align-items: center;
     justify-content: flex-start
   }

   .module-tile.current {
     border-color: var(--blue);
     box-shadow: 0 0 0 3px rgba(23, 111, 209, .12)
   }

   .module-tile[role="button"] {
     cursor: pointer
   }

   .module-tile[role="button"]:active {
     transform: scale(.98)
   }

   .module-tile[role="button"]:focus-visible {
     outline: 3px solid rgba(23, 111, 209, .28);
     outline-offset: 2px
   }

   .module-icon {
     width: 43px;
     height: 43px;
     border-radius: 15px;
     display: flex;
     align-items: center;
     justify-content: center;
     background: var(--neutral-soft);
     color: #5B6C7F
   }

   .module-icon svg {
     width: 24px;
     height: 24px;
     fill: none;
     stroke: currentColor;
     stroke-width: 2.2;
     stroke-linecap: round;
     stroke-linejoin: round
   }

   .module-name {
     font-size: 17px;
     font-weight: 800;
     line-height: 1.2;
     margin-top: 8px
   }

   .module-status {
     font-size: 14px;
     font-weight: 750;
     line-height: 1.25;
     color: var(--ink-soft);
     margin-top: 4px
   }

   .module-action {
     font-size: 13.5px;
     font-weight: 800;
     color: var(--blue);
     margin-top: 4px
   }

   .module-tile.ok {
     border-color: #B6DED2
   }

   .module-tile.ok .module-icon {
     background: var(--green-soft);
     color: var(--green)
   }

   .module-tile.ok .module-status {
     color: var(--green)
   }

   .module-tile.warn {
     border-color: #E8CE9A
   }

   .module-tile.warn .module-icon {
     background: var(--amber-soft);
     color: var(--amber)
   }

   .module-tile.warn .module-status {
     color: var(--amber)
   }

   .module-tile.bad {
     border-color: #E8ADAA
   }

   .module-tile.bad .module-icon {
     background: var(--red-soft);
     color: var(--red)
   }

   .module-tile.bad .module-status {
     color: var(--red)
   }

   .next-step {
     margin-top: 12px;
     padding: 12px 14px;
     border: 1.5px solid var(--line);
     border-radius: 18px;
     background: #fff;
     font-size: 16.5px;
     font-weight: 750;
     color: var(--ink-soft);
     line-height: 1.4;
     text-align: center
   }

   .next-step.review {
     background: var(--amber-soft);
     border-color: #E7C88B;
     color: #744606
   }

   .next-step.urgent {
     background: var(--red-soft);
     border-color: #E7A39F;
     color: #912D29
   }

   .emergency-reminder {
     margin-top: 10px;
     padding: 10px 12px 10px 14px;
     border-radius: 15px;
     border: 1px solid var(--line);
     border-left: 5px solid var(--red);
     background: #fff;
     display: flex;
     align-items: center;
     justify-content: space-between;
     gap: 10px;
     font-size: 15.5px;
     font-weight: 750;
     color: var(--ink-soft)
   }

   .emergency-reminder button {
     border: 0;
     background: transparent;
     color: var(--red);
     font-size: 16px;
     font-weight: 800;
     cursor: pointer;
     white-space: nowrap
   }

   .emergency-reminder button:active {
     transform: scale(.97)
   }

   .research-panel {
     margin-top: 12px
   }

   .research-panel details {
     border: 1.5px dashed #9AABBC;
     border-radius: 18px;
     background: #fff;
     padding: 0 15px
   }

   .research-panel summary {
     min-height: 54px;
     display: flex;
     align-items: center;
     cursor: pointer;
     font-size: 16.5px;
     font-weight: 800;
     color: var(--ink-soft)
   }

   .research-content {
     padding: 0 0 16px
   }

   .research-warning {
     font-size: 15px;
     font-weight: 700;
     color: var(--red);
     line-height: 1.45;
     margin-bottom: 11px
   }

   .technical-grid {
     display: grid;
     grid-template-columns: 1fr auto;
     gap: 8px 12px;
     font-size: 15px
   }

   .technical-grid dt {
     color: var(--ink-soft);
     font-weight: 700
   }

   .technical-grid dd {
     font-family: 'Manrope';
     font-weight: 800;
     text-align: right
   }

   .dev-panel {
     margin-top: 12px
   }

   .dev-card {
     border: 1.5px solid #75879A;
     border-radius: 18px;
     background: #101923;
     color: #E8F0F8;
     overflow: hidden
   }

   .dev-header {
     min-height: 54px;
     padding: 10px 12px 10px 15px;
     display: flex;
     align-items: center;
     justify-content: space-between;
     gap: 12px;
     border-bottom: 1px solid rgba(255,255,255,.13)
   }

   .dev-title {
     font-family: 'Manrope';
     font-size: 15px;
     font-weight: 800;
     letter-spacing: .1px
   }

   .dev-copy-button {
     min-height: 38px;
     padding: 0 13px;
     border: 1px solid rgba(255,255,255,.28);
     border-radius: 11px;
     background: rgba(255,255,255,.10);
     color: #fff;
     font-family: 'Manrope';
     font-size: 13px;
     font-weight: 800;
     cursor: pointer
   }

   .dev-copy-button:active {
     transform: scale(.97)
   }

   .dev-integrity-summary {
     margin: 10px 0 4px;
     padding: 9px 11px;
     border-radius: 12px;
     border: 1px solid rgba(255,255,255,.14);
     background: rgba(255,255,255,.06);
     color: #DCE8F5;
     font: 700 11px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
   }

   .dev-integrity-summary.ok { color: #8FF0BE; }
   .dev-integrity-summary.warning { color: #FFD37A; }
   .dev-integrity-summary.error { color: #FF9C98; }

   .dev-copy-status {
     min-height: 20px;
     padding: 6px 15px 0;
     color: #A9E8D8;
     font-size: 13px;
     font-weight: 700
   }

   .dev-log {
     width: 100%;
     max-height: 440px;
     margin: 0;
     padding: 12px 15px 16px;
     overflow: auto;
     white-space: pre-wrap;
     overflow-wrap: anywhere;
     color: #D9E6F2;
     font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
     font-size: 12px;
     line-height: 1.55
   }

   .actions {
     margin-top: 13px;
     display: flex;
     flex-direction: column;
     gap: 8px
   }

   .btn-primary,
   .btn-secondary {
     width: 100%;
     min-height: 56px;
     border-radius: 19px;
     padding: 10px 16px;
     font-size: 19px;
     font-weight: 800;
     cursor: pointer
   }

   .btn-primary {
     border: 0;
     background: var(--blue);
     color: #fff;
     box-shadow: 0 9px 22px rgba(23, 111, 209, .19)
   }

   .btn-secondary {
     border: 1.5px solid #AFC0D1;
     background: #fff;
     color: var(--ink)
   }

   .btn-primary:active,
   .btn-secondary:active {
     transform: scale(.985)
   }

   .btn-text {
     min-height: 40px;
     border: 0;
     background: transparent;
     color: var(--ink-soft);
     font-size: 15.5px;
     font-weight: 750;
     cursor: pointer;
     text-decoration: underline;
     text-underline-offset: 4px
   }

   .legal-note {
     font-size: 14px;
     font-weight: 650;
     color: var(--muted);
     text-align: center;
     margin-top: 9px
   }

   [hidden] {
     display: none !important
   }

   @media(min-width:520px) {
     body {
       max-width: 500px;
       margin: 0 auto;
       box-shadow: 0 0 0 1px rgba(20, 34, 53, .05), 0 20px 64px rgba(20, 34, 53, .14)
     }
   }

   @media(max-width:355px) {
     header {
       padding-left: 12px;
       padding-right: 12px
     }

     .brand-text {
       font-size: 17px
     }

     .lang-seg button {
       min-width: 38px;
       padding: 0 6px
     }

     main {
       padding-left: 10px;
       padding-right: 10px
     }

     .summary-main {
       grid-template-columns: 92px minmax(0, 1fr);
       gap: 12px
     }

     .metric {
       min-height: 98px
     }

     .metric-value {
       font-size: 37px
     }

     .summary-title {
       font-size: 24px
     }

     .module-grid {
       gap: 6px
     }

     .module-tile {
       padding-left: 5px;
       padding-right: 5px
     }

     .module-name {
       font-size: 16px
     }

     .module-status {
       font-size: 13px
     }

     .module-action {
       font-size: 12.5px
     }
   }

   @media(max-height:700px) {
     main {
       padding-top: 10px
     }

     .summary-body {
       padding: 15px
     }

     .summary-main {
       grid-template-columns: 96px minmax(0, 1fr)
     }

     .metric {
       min-height: 96px
     }

     .metric-value {
       font-size: 39px
     }

     .module-tile {
       min-height: 112px
     }

     .next-step {
       padding-top: 10px;
       padding-bottom: 10px
     }

     .actions {
       margin-top: 10px
     }
   }

   @media(prefers-reduced-motion:reduce) {
     * {
       transition: none !important;
       animation: none !important;
       scroll-behavior: auto !important
     }
   }

   .finalization-panel{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(31,50,69,.06)}
   .finalization-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
   .finalization-title{font-size:17px;font-weight:850;color:var(--ink)}
   .finalization-badge{padding:5px 9px;border-radius:999px;background:#EAF3FF;color:#1457A6;font-size:11px;font-weight:850;letter-spacing:.04em;text-transform:uppercase}
   .finalization-meta{margin-top:9px;color:var(--ink-soft);font-size:13px;font-weight:650;line-height:1.55}
   .integrity-box{margin-top:12px;padding:11px 12px;border-radius:14px;background:#F3F7FB;color:var(--ink-soft);font-size:13px;font-weight:700;line-height:1.5}
   .integrity-box.ok{background:#EAF8EF;color:#17663A}
   .integrity-box.error{background:#FFF0EE;color:#A33A2F}
   .integrity-list{margin:7px 0 0;padding-left:18px;font-size:12px;font-weight:650}
   .finalization-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
   .finalization-actions button{min-height:44px;padding:10px 14px;border-radius:13px;font-family:inherit;font-size:13px;font-weight:850;cursor:pointer}
   .finalize-button{border:0;background:#1F7A4D;color:#fff;flex:1 1 220px}
   .finalize-button:disabled{opacity:.45;cursor:not-allowed}
   .export-button{border:1.5px solid var(--line);background:#fff;color:var(--ink);flex:1 1 150px}
   .finalization-status{min-height:18px;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-soft)}
  </style>
  <script src="config.js">
  </script>
  <script src="./js/app-mode.js?v=20260807-app-mode-v2"></script>
<script src="./js/research-policy.js?v=20260801-research-policy-v1"></script>
<script src="./js/data-contract.js?v=20260801-clinic-contract-v1"></script>
  <script src="./js/research-store.js?v=20260801-clinic-store-v1"></script>
<script src="./js/jssf-remote-sync.js?v=20260925-jssf-draft-v1"></script>
<script src="./js/dev-mode.js?v=20260801-dev-mode-v1"></script>
  <script src="./js/languages.js?v=20260717-lang-v1"></script>
  <script src="./js/i18n.js">
  </script>
 </head>
 <body>
  <header>
   <div aria-label="QuickStroke" class="brand">
    <div aria-hidden="true" class="brand-mark">
     <svg viewbox="0 0 24 24">
      <path d="M3 13h3.4l1.7-4.8 3.1 10.2 2.3-7.8 1.7 2.4H21">
      </path>
     </svg>
    </div>
    <div class="brand-text">
     Quick
     <strong>
      Stroke
     </strong>
    </div>
   </div>
   <div aria-label="Language selection" class="lang-seg" data-language-picker data-language-variant="compact" data-language-handler="resultSwitchLang" data-id-prefix="lang-" data-active-class="active"></div>
   <script>QuickStrokeLanguages.renderPicker(document.currentScript.previousElementSibling);</script>
  </header>
  <main>
   <section aria-live="polite" class="summary-card noData" id="summary-card">
    <div class="summary-accent">
    </div>
    <div class="summary-body">
     <div class="summary-main">
      <div class="metric">
       <div class="metric-value" id="metric-value">
        0/3
       </div>
       <div class="metric-label" id="metric-label">
       </div>
      </div>
      <div>
       <div class="summary-kicker" id="summary-kicker">
       </div>
       <h1 class="summary-title" id="summary-title">
        กำลังเตรียมผล...
       </h1>
       <p class="summary-desc" id="summary-desc">
       </p>
       <p class="completion" hidden="" id="completion">
       </p>
      </div>
     </div>
     <div class="emergency-action" hidden="" id="emergency-action">
     </div>
    </div>
   </section>
   <section aria-label="Module results" class="module-grid" id="module-grid">
   </section>
   <section class="next-step" id="next-step">
   </section>
   <section class="emergency-reminder" id="emergency-reminder">
   </section>
   <section class="research-panel" hidden="" id="research-panel">
    <details>
     <summary id="technical-title">
     </summary>
     <div class="research-content">
      <p class="research-warning" id="technical-disclaimer">
      </p>
      <dl class="technical-grid" id="technical-grid">
      </dl>
     </div>
    </details>
   </section>

   <section class="finalization-panel" hidden id="finalization-panel" aria-labelledby="finalization-title">
    <div class="finalization-header">
     <div>
      <div class="finalization-title" id="finalization-title">Research session finalization</div>

  <script>
   'use strict';
   const RESULT_LOCALE_MAP = window.QuickStrokeLanguages?.localeMap || Object.freeze({
     th: 'th-TH',

     ja: 'ja-JP'
   });
   const MODULES = Object.freeze(['face', 'arm', 'speech']);
   const RESULT_CFG = window.QS_CONFIG?.scoring || {};
   const WEIGHTS = Object.freeze({
     face: RESULT_CFG.faceWeight ?? .40,

     speech: RESULT_CFG.speechWeight ?? .20
   });
   const SINGLE_POSITIVE_OVERRIDE = RESULT_CFG.singlePositiveOverride ?? true;
   const QUERY_PARAMS = new URLSearchParams(location.search);
   const RESULT_APP_MODE = window.QuickStrokeAppMode || null;
   const RESULT_RESEARCH_POLICY = window.QuickStrokeResearchPolicy || null;
   const RESULT_DIAGNOSTIC_VERSION = window.QS_CONFIG?.resultDiagnostics?.version ||
     'result-dev-diagnostics-1.2.0';
   const RESULT_CONTRACT = window.QuickStrokeDataContract || null;
   const RESULT_RESEARCH_STORE = window.QuickStrokeResearchStore || null;
   const APP_MODE_NAME = RESULT_APP_MODE?.resolveMode?.() || (window.QuickStrokeDevMode?.isEnabled?.() ? 'dev' : 'public');

   function storedResultSessionModeHint() {
     const contractContext = RESULT_CONTRACT?.getSessionContext?.() || {};
     const contractMode = contractContext.appMode;
     if (['research','dev'].includes(contractMode)) return contractMode;
     const storedMode = sessionStorage.getItem('fast_session_app_mode');
     if (['research','dev'].includes(storedMode)) return storedMode;
     const storedRole = sessionStorage.getItem('fast_session_analysis_role');
     if (storedRole === 'research_candidate') return 'research';
     if (storedRole === 'engineering_only') return 'dev';
     if (sessionStorage.getItem('fast_session_research_metadata')) return 'research';
     return ['public','research','dev'].includes(contractMode) ? contractMode : APP_MODE_NAME;
   }

   function effectiveResultAppMode() {
     const canonicalMode = RESULT_DATA_CONTEXT?.session?.appMode;
     if (['public','research','dev'].includes(canonicalMode)) return canonicalMode;
     return storedResultSessionModeHint();
   }

   function isResearchResultSession() { return effectiveResultAppMode() === 'research'; }
   function isDevResultSession() {
     return effectiveResultAppMode() === 'dev' && window.QuickStrokeDevMode?.isEnabled?.() === true;
   }
   function isPublicResultSession() { return effectiveResultAppMode() === 'public'; }
   function isDetailResultSession() { return isResearchResultSession() || isDevResultSession(); }

   function recoverResultSessionModeSnapshot() {
     const identity = RESULT_CONTRACT?.getSessionContext?.() || {};
     if (!identity.screeningSessionId) return effectiveResultAppMode();
     const hint = storedResultSessionModeHint();
     const currentStoredMode = sessionStorage.getItem('fast_session_app_mode');
     if (hint === 'research' && currentStoredMode !== 'research') {
       sessionStorage.setItem('fast_session_app_mode', 'research');
       sessionStorage.setItem('fast_session_analysis_role', 'research_candidate');
       console.warn('[QuickStroke result] Restored Research session mode from the active session metadata.');
     } else if (hint === 'dev' && currentStoredMode !== 'dev') {
       sessionStorage.setItem('fast_session_app_mode', 'dev');
       sessionStorage.setItem('fast_session_analysis_role', 'engineering_only');
       console.warn('[QuickStroke result] Restored Dev session mode from the active session metadata.');
     }
     return hint;
   }
   let CURRENT_DEV_LOG = '';

   const REQUIRED = Object.freeze([

     'technicalError',
     'invalidReason',
     'qualityFlags'
   ]);
   const ICONS = Object.freeze({
     face: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>',
     arm: '<svg viewBox="0 0 24 24"><path d="M7 20v-8a2 2 0 0 1 4 0v1-5a2 2 0 0 1 4 0v5-3a2 2 0 0 1 4 0v5c0 4-2.5 6-6 6h-1c-2.8 0-5-2.2-5-5z"/></svg>',
     speech: '<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v3"/></svg>'
   });
   let T = null,
     LANG = 'th',
     requestId = 0,
     CURRENT = null;

   function validate(m, l) {
     if (!m || typeof m !== 'object') throw new Error(`Missing result translations for ${l}`);
     const missing = REQUIRED.filter(k => m[k] === undefined);
     if (missing.length) throw new Error(
       `Incomplete result translations for ${l}: ${missing.join(', ')}`)
   }

   function savedLang() {
     return String(sessionStorage.getItem('fast_lang') || 'th').split('-')[0].toLowerCase()
   }

   function setLangButtons(code) {
     window.QuickStrokeLanguages?.setActive(
       document.querySelector('header .lang-seg'),

     )
   }
   async function readLocale(locale, persist) {
     if (!window.QuickStrokeI18n) throw new Error('QuickStrokeI18n unavailable');
     await window.QuickStrokeI18n.setLocale(locale, {
       persist,
       apply: false
     });
     const m = window.QuickStrokeI18n.getMessages()?.result;
     validate(m, locale);
     return m
   }
   async function loadResultLanguage(code, {
     persist = true
   } = {}) {
     code = String(code || 'th').split('-')[0].toLowerCase();
     let locale = RESULT_LOCALE_MAP[code];
     if (!locale) {
       code = 'th';
       locale = RESULT_LOCALE_MAP.th
     }
     const id = ++requestId;
     let m;
     try {
       m = await readLocale(locale, persist)
     } catch (e) {
       console.error(e);
       if (code === 'en') return false;
       code = 'en';
       locale = RESULT_LOCALE_MAP.en;
       try {
         m = await readLocale(locale, false)
       } catch (e2) {
         console.error(e2);
         return false
       }
     }
     if (id !== requestId) return false;
     T = m;
     LANG = code;
     if (persist) sessionStorage.setItem('fast_lang', code);
     document.documentElement.lang = locale;
     document.title = T.pageTitle;
     setLangButtons(code);
     await buildResult();
     return true
   }

   const PUBLIC_ABNORMAL_HISTORY_PREFIX = 'fast_public_abnormal_history_v1_';

   function publicAbnormalHistoryKey() {
     const identity = currentSessionIdentity();
     return `${PUBLIC_ABNORMAL_HISTORY_PREFIX}${identity.screeningSessionId || 'session'}`;
   }

   function readPublicAbnormalHistory() {
     if (!isPublicResultSession()) return {};
     try {
       const parsed = JSON.parse(sessionStorage.getItem(publicAbnormalHistoryKey()) || '{}');
       return parsed && typeof parsed === 'object' ? parsed : {};
     } catch (error) {
       return {};
     }
   }

   function rememberPublicAbnormal(name, data) {
     if (!isPublicResultSession() || !MODULES.includes(name) || !data || typeof data !== 'object') return;
     if (!moduleIsUsable(data) || moduleClass(data) !== 'bad') return;
     const history = readPublicAbnormalHistory();
     const previous = history[name] && typeof history[name] === 'object' ? history[name] : {};
     const fingerprint = data.moduleRunId || data.completedAt || data.startedAt || `${name}:abnormal`;
     history[name] = {
       firstDetectedAt: previous.firstDetectedAt || data.completedAt || new Date().toISOString(),
       lastDetectedAt: data.completedAt || new Date().toISOString(),
       count: Number(previous.count || 0) + (previous.lastFingerprint === fingerprint ? 0 : 1),
       lastModuleRunId: data.moduleRunId || previous.lastModuleRunId || null,
       lastFingerprint:fingerprint
     };
     try { sessionStorage.setItem(publicAbnormalHistoryKey(), JSON.stringify(history)); }
     catch (error) { console.warn('Unable to retain Public abnormal history.', error); }
   }

   function applyPublicAbnormalHistory(name, data) {
     if (!isPublicResultSession() || !data || typeof data !== 'object') return data;
     const prior = readPublicAbnormalHistory()[name];
     if (!prior) return data;
     const latestClass = moduleClass(data);
     return {
       ...data,
       historicalAbnormalRetained: latestClass !== 'bad',
       abnormalHistoryCount: Number(prior.count || 1),
       publicAbnormalHistoryRetained: true
     };
   }

   function readLegacyModule(name) {
     const raw = sessionStorage.getItem(`fast_${name}`);
     if (!raw) return null;
     try {
       const d = JSON.parse(raw);
       return d && typeof d === 'object' ? applyPublicAbnormalHistory(name, d) : null
     } catch (e) {
       console.warn(e);
       return {
         module: name,
         validityStatus: 'not_evaluable',
         clinicalResult: null,
         clinicalScore: null,
         scoreUsable: false,
         riskLevel: 'invalid',
         invalidReasonCode: 'RESULT_DATA_PARSE_ERROR',
         resultDataSource: 'legacy_parse_error'
       }
     }
   }

   function numberOrNull(value) {
     const number = Number(value);
     return Number.isFinite(number) ? number : null
   }

   function timestampValue(value) {
     const parsed = Date.parse(value || '');
     return Number.isFinite(parsed) ? parsed : 0
   }

   function uniqueStrings(values) {
     return [...new Set((values || []).filter(Boolean).map(String))]
   }

   function observationRiskLevel(status) {
     if (status === 'abnormal') return 'bad';
     if (status === 'attention') return 'warn';
     if (status === 'no_alert') return 'ok';
     return 'invalid'
   }

   function observationClinicalResult(status) {
     if (status === 'abnormal') return 'abnormal';
     if (status === 'attention') return 'warning';
     if (status === 'no_alert') return 'normal';
     return null
   }

   function projectionView(projection, moduleName) {
     if (!projection || typeof projection !== 'object') return null;
     if (!projection.payload || typeof projection.payload !== 'object') return projection;
     if (!RESULT_CONTRACT?.createLightweightProjectionPayload) return projection.payload;
     return {
       ...RESULT_CONTRACT.createLightweightProjectionPayload(moduleName, {
         ...projection.payload,
         moduleRunId: projection.selectedModuleRunId || projection.payload.moduleRunId || null,
         selectedTestAttemptId: projection.selectedTestAttemptId || projection.payload.selectedTestAttemptId || projection.payload.testAttemptId || null,
         selectedTestAttemptIds: projection.selectedTestAttemptIds || projection.payload.selectedTestAttemptIds || null
       }),
       projectionId: projection.projectionId || null,
       participantId: projection.participantId || projection.payload.participantId || null,
       screeningSessionId: projection.screeningSessionId || projection.payload.screeningSessionId || null,
       selectedModuleRunId: projection.selectedModuleRunId || projection.payload.moduleRunId || null,
       updatedAt: projection.updatedAt || projection.payload.completedAt || null
     }
   }

   function sortModuleRunsDescending(a, b) {
     const sequenceDelta = Number(b?.moduleRunSequenceNo || 0) - Number(a?.moduleRunSequenceNo || 0);
     if (sequenceDelta) return sequenceDelta;
     return timestampValue(b?.completedAt || b?.finalizedAt || b?.startedAt) -
       timestampValue(a?.completedAt || a?.finalizedAt || a?.startedAt)
   }

   function selectedIdsForRun(run, moduleName) {
     if (!run) return [];
     if (moduleName === 'arm') {
       return uniqueStrings([
         run.selectedTestAttemptIds?.left,
         run.selectedTestAttemptIds?.right
       ])
     }
     return uniqueStrings([run.selectedTestAttemptId])
   }

   function aggregateTechnicalValidity(attempts, fallback = 'not_assessed') {
     const values = attempts.map(attempt => attempt?.technicalValidity).filter(Boolean);
     if (values.includes('failed')) return 'failed';
     if (values.includes('degraded')) return 'degraded';
     if (values.includes('full')) return 'full';
     return fallback || 'not_assessed'
   }

   function aggregateQualityStatus(attempts, fallback = 'not_assessed') {
     const values = attempts.map(attempt => attempt?.qualityStatus).filter(Boolean);
     if (values.includes('unusable')) return 'unusable';
     if (values.includes('limited')) return 'limited';
     if (values.includes('acceptable')) return 'acceptable';
     return fallback || 'not_assessed'
   }

   function legacyResearchScore(legacy) {
     if (!legacy || typeof legacy !== 'object') return null;
     return numberOrNull(
       legacy.researchMetrics?.legacyWeightedScore ??
       legacy.researchMetrics?.legacyFaceScore ??
       legacy.researchMetrics?.legacyArmScore ??
       legacy.clinicalScore ??
       legacy.score
     )
   }

   function buildCanonicalModule(name, bundle, legacy, integrity) {
     const completedRuns = bundle.moduleRuns
       .filter(run => run?.module === name && run?.moduleRunStatus === 'completed')
       .sort(sortModuleRunsDescending);
     const latestRun = completedRuns[0] || null;
     const rawProjection = bundle.projections.find(item => item?.module === name) || null;
     const projection = projectionView(rawProjection, name);
     const attemptsById = bundle.attemptsById;

     if (!latestRun) {
       if (legacy) {
         integrity.warnings.push(`${name.toUpperCase()}_CANONICAL_RUN_MISSING_LEGACY_FALLBACK`);
         return { ...legacy, module: name, resultDataSource: 'legacy_fallback' }
       }
       return null
     }

     const selectedIds = selectedIdsForRun(latestRun, name);
     const selectedAttempts = selectedIds.map(id => attemptsById.get(id)).filter(Boolean);
     let selectionIntegrityFailed = false;
     selectedIds.forEach(id => {
       const attempt = attemptsById.get(id);
       if (!attempt) {
         selectionIntegrityFailed = true;
         integrity.errors.push(`${name.toUpperCase()}_SELECTED_ATTEMPT_MISSING:${id}`);
       } else if (attempt.moduleRunId !== latestRun.moduleRunId || attempt.module !== name) {
         selectionIntegrityFailed = true;
         integrity.errors.push(`${name.toUpperCase()}_SELECTED_ATTEMPT_IDENTITY_MISMATCH:${id}`);
       }
     });

     if (name === 'arm') {
       if (!latestRun.selectedTestAttemptIds?.left) {
         selectionIntegrityFailed = true;
         integrity.errors.push('ARM_LEFT_SELECTED_ATTEMPT_MISSING')
       }
       if (!latestRun.selectedTestAttemptIds?.right) {
         selectionIntegrityFailed = true;
         integrity.errors.push('ARM_RIGHT_SELECTED_ATTEMPT_MISSING')
       }
     } else if (!latestRun.selectedTestAttemptId) {
       selectionIntegrityFailed = true;
       integrity.errors.push(`${name.toUpperCase()}_SELECTED_ATTEMPT_MISSING`)
     }

     const projectionMatchesRun = projection?.selectedModuleRunId === latestRun.moduleRunId ||
       projection?.moduleRunId === latestRun.moduleRunId;
     if (!projection) {
       integrity.warnings.push(`${name.toUpperCase()}_PROJECTION_MISSING`);
     } else if (!projectionMatchesRun) {
       integrity.warnings.push(`${name.toUpperCase()}_PROJECTION_STALE`);
     }

     if (projectionMatchesRun) {
       const projectionIds = name === 'arm'
         ? uniqueStrings([projection.selectedTestAttemptIds?.left, projection.selectedTestAttemptIds?.right])
         : uniqueStrings([projection.selectedTestAttemptId]);
       if (selectedIds.join('|') !== projectionIds.join('|')) {
         integrity.warnings.push(`${name.toUpperCase()}_PROJECTION_SELECTION_MISMATCH`);
       }
     }

     const validityStatus = selectionIntegrityFailed
       ? 'not_evaluable'
       : latestRun.validityStatus || projection?.validityStatus || 'not_evaluable';
     const latestObservationStatus = selectionIntegrityFailed
       ? 'not_available'
       : latestRun.observationStatus || projection?.observationStatus ||
         (validityStatus === 'valid' ? 'indeterminate' : 'not_available');
     const abnormalHistoryRuns = completedRuns.filter(run =>
       run?.validityStatus === 'valid' && run?.observationStatus === 'abnormal'
     );
     const historicalAbnormalRetained = latestObservationStatus !== 'abnormal' && abnormalHistoryRuns.length > 0;
     // Current Result follows the latest completed eligible run. A prior valid
     // abnormal is retained separately as a historical safety warning rather
     // than silently rewriting the latest measurement back to abnormal.
     const observationStatus = latestObservationStatus;
     const qualityFlags = uniqueStrings([
       ...(projection?.qualityFlags || []),
       ...selectedAttempts.flatMap(attempt => attempt?.qualityFlags || [])
     ]);
     const technicalValidity = selectionIntegrityFailed
       ? 'failed'
       : aggregateTechnicalValidity(
           selectedAttempts,
           projection?.technicalValidity || (validityStatus === 'valid' ? 'full' : 'not_assessed')
         );
     const qualityStatus = aggregateQualityStatus(
       selectedAttempts,
       projection?.qualityStatus || (validityStatus === 'valid' ? (qualityFlags.length ? 'limited' : 'acceptable') : 'unusable')
     );
     const invalidReasonCode = validityStatus === 'valid'
       ? null
       : selectionIntegrityFailed
         ? 'RESULT_SELECTION_INTEGRITY_ERROR'
         : selectedAttempts.find(attempt => attempt?.invalidReasonCode)?.invalidReasonCode ||
           projection?.invalidReasonCode || null;
     const researchScore = numberOrNull(projection?.researchSummary?.legacyScore) ?? legacyResearchScore(legacy);

     return {
       module: name,
       participantId: latestRun.participantId || projection?.participantId || null,
       screeningSessionId: latestRun.screeningSessionId || projection?.screeningSessionId || null,
       moduleRunId: latestRun.moduleRunId,
       moduleRunSequenceNo: latestRun.moduleRunSequenceNo ?? null,
       selectedTestAttemptId: name === 'arm' ? null : latestRun.selectedTestAttemptId || null,
       selectedTestAttemptIds: name === 'arm' ? { ...latestRun.selectedTestAttemptIds } : null,
       testAttemptId: name === 'arm' ? null : latestRun.selectedTestAttemptId || null,
       attemptSequenceNo: name === 'arm'
         ? null
         : selectedAttempts[0]?.attemptSequenceNo ?? null,
       attemptTrigger: name === 'arm'
         ? null
         : selectedAttempts[0]?.attemptTrigger ?? null,
       startedAt: latestRun.startedAt || null,
       completedAt: latestRun.completedAt || latestRun.finalizedAt || projection?.completedAt || null,
       validityStatus,
       technicalValidity,
       observationStatus,
       latestObservationStatus,
       historicalAbnormalRetained,
       abnormalHistoryCount:abnormalHistoryRuns.length,
       abnormalHistoryModuleRunIds:abnormalHistoryRuns.map(run => run.moduleRunId),
       qualityStatus,
       qualityFlags,
       invalidReasonCode,
       screeningDisplayStatus: observationStatus,
       displayStatus: observationStatus,
       clinicalResult: observationClinicalResult(observationStatus),
       riskLevel: observationRiskLevel(observationStatus),
       passed: observationStatus === 'no_alert',
       clinicalScore: researchScore,
       score: researchScore,
       scoreUsable: researchScore !== null,
       domainSummary: projectionMatchesRun ? projection?.domainSummary || null : null,
       versions: latestRun.versionSnapshot?.moduleVersions || null,
       screeningContext: {
         participantId: latestRun.participantId || null,
         screeningSessionId: latestRun.screeningSessionId || null
       },
       resultDataSource: projectionMatchesRun ? 'canonical_projection' : 'canonical_module_run',
       canonicalSelection: name === 'arm'
         ? { ...latestRun.selectedTestAttemptIds }
         : latestRun.selectedTestAttemptId || null
     }
   }

   function currentSessionIdentity() {
     const context = RESULT_CONTRACT?.getSessionContext?.() || {};
     return {
       participantId: context.participantId || sessionStorage.getItem('fast_participant_id') || null,
       screeningSessionId: context.screeningSessionId ||
         sessionStorage.getItem('fast_screening_session_id') ||
         sessionStorage.getItem('fast_assessment_id') || null
     }
   }

   async function readCanonicalBundle(screeningSessionId) {
     const stores = RESULT_RESEARCH_STORE?.stores;
     if (!RESULT_RESEARCH_STORE || !stores || !screeningSessionId) return null;
     const [session, moduleRuns, attempts, projections] = await Promise.all([
       RESULT_RESEARCH_STORE.get(stores.screeningSessions, screeningSessionId),
       RESULT_RESEARCH_STORE.getAllByIndex(stores.moduleRuns, 'screeningSessionId', screeningSessionId),
       RESULT_RESEARCH_STORE.getAllByIndex(stores.testAttempts, 'screeningSessionId', screeningSessionId),
       RESULT_RESEARCH_STORE.getAllByIndex(stores.resultProjections, 'screeningSessionId', screeningSessionId)
     ]);
     return {
       session,
       moduleRuns: Array.isArray(moduleRuns) ? moduleRuns : [],
       attempts: Array.isArray(attempts) ? attempts : [],
       projections: Array.isArray(projections) ? projections : [],
       attemptsById: new Map((attempts || []).map(attempt => [attempt.testAttemptId, attempt]))
     }
   }

   function canonicalPersistenceCaughtUp(bundle, legacyModules) {
     if (!bundle) return false;
     return MODULES.every(name => {
       const legacyRunId = legacyModules[name]?.moduleRunId;
       if (!legacyRunId) return true;
       return bundle.moduleRuns.some(run => run?.moduleRunId === legacyRunId && run?.moduleRunStatus === 'completed')
     })
   }

   async function loadResultDataContext() {
     // Result routing follows the active/canonical screening session rather than
     // only the mode currently highlighted on the index page. Recover the
     // session snapshot before IndexedDB namespace selection.
     recoverResultSessionModeSnapshot();
     const legacyModules = Object.fromEntries(MODULES.map(name => [name, readLegacyModule(name)]));
     const identity = currentSessionIdentity();
     const integrity = {
       status: 'ok',
       errors: [],
       warnings: [],
       sessionIdentity: identity,
       canonicalRecordCounts: { moduleRuns: 0, attempts: 0, projections: 0 },
       moduleSources: {}
     };

     if (!RESULT_RESEARCH_STORE || RESULT_RESEARCH_STORE.isPersistenceEnabled?.() !== true || !identity.screeningSessionId) {
       integrity.warnings.push('CANONICAL_STORE_UNAVAILABLE');
       integrity.status = 'warning';
       MODULES.forEach(name => {
         integrity.moduleSources[name] = legacyModules[name] ? 'legacy_fallback' : 'missing'
       });
       return { source: 'legacy', session: null, modules: legacyModules, integrity }
     }

     let bundle = null;
     const delays = [0, 120, 300, 650];
     for (const delay of delays) {
       if (delay) await new Promise(resolve => setTimeout(resolve, delay));
       try {
         bundle = await readCanonicalBundle(identity.screeningSessionId);
       } catch (error) {
         integrity.warnings.push(`CANONICAL_READ_FAILED:${error?.code || error?.name || 'ERROR'}`);
         break
       }
       if (canonicalPersistenceCaughtUp(bundle, legacyModules)) break
     }

     if (!bundle) {
       integrity.status = 'warning';
       MODULES.forEach(name => {
         integrity.moduleSources[name] = legacyModules[name] ? 'legacy_fallback' : 'missing'
       });
       return { source: 'legacy', session: null, modules: legacyModules, integrity }
     }

     integrity.canonicalRecordCounts = {
       moduleRuns: bundle.moduleRuns.length,
       attempts: bundle.attempts.length,
       projections: bundle.projections.length
     };

     if (!bundle.session) {
       integrity.errors.push('SCREENING_SESSION_RECORD_MISSING');
     } else {
       if (bundle.session.sessionStatus === 'protocol_completed' && bundle.session.protocolCompletedAt) {
         RESULT_CONTRACT?.markProtocolCompleted?.(bundle.session.protocolCompletedAt, bundle.session.protocolCompletionReasonCode || 'FULL_PROTOCOL_FIRST_COMPLETION');
       } else if (bundle.session.sessionStatus === 'finalized' && bundle.session.finalizedAt) {
         RESULT_CONTRACT?.finalizeScreeningSession?.({
           ...(bundle.session.finalizationMetadata || {}),
           finalizedAt:bundle.session.finalizedAt
         });
       }
       if (bundle.session.screeningSessionId !== identity.screeningSessionId) {
         integrity.errors.push('SCREENING_SESSION_IDENTITY_MISMATCH');
       }
       if (identity.participantId && bundle.session.participantId !== identity.participantId) {
         integrity.errors.push('PARTICIPANT_IDENTITY_MISMATCH');
       }
     }

     if (integrity.errors.some(code => [
       'SCREENING_SESSION_RECORD_MISSING',
       'SCREENING_SESSION_IDENTITY_MISMATCH',
       'PARTICIPANT_IDENTITY_MISMATCH'
     ].includes(code))) {
       integrity.status = 'error';
       MODULES.forEach(name => {
         integrity.moduleSources[name] = legacyModules[name] ? 'legacy_identity_fallback' : 'missing'
       });
       return {
         source: 'legacy',
         session: bundle.session,
         modules: legacyModules,
         integrity,
         canonicalBundle: bundle
       }
     }

     const modules = {};
     MODULES.forEach(name => {
       const canonicalModuleData = buildCanonicalModule(name, bundle, legacyModules[name], integrity);
       const moduleData = isPublicResultSession()
         ? applyPublicAbnormalHistory(name, canonicalModuleData)
         : canonicalModuleData;
       modules[name] = moduleData;
       integrity.moduleSources[name] = moduleData?.resultDataSource || 'missing';
     });

     const pendingRetry = (() => {
       try { return JSON.parse(sessionStorage.getItem('fast_pending_module_retry') || 'null') }
       catch (error) { return null }
     })();
     if (pendingRetry?.module && MODULES.includes(pendingRetry.module)) {
       const current = modules[pendingRetry.module];
       if (current?.moduleRunId === pendingRetry.previousModuleRunId) {
         modules[pendingRetry.module] = null;
         integrity.warnings.push(`${pendingRetry.module.toUpperCase()}_RETRY_PENDING`);
         integrity.moduleSources[pendingRetry.module] = 'pending_retry'
       } else if (current?.moduleRunId && current.moduleRunId !== pendingRetry.previousModuleRunId) {
         sessionStorage.removeItem('fast_pending_module_retry')
       }
     }

     const sourceValues = Object.values(integrity.moduleSources);
     const hasCanonical = sourceValues.some(value => String(value).startsWith('canonical_'));
     const hasLegacy = sourceValues.some(value => value === 'legacy_fallback');
     integrity.status = integrity.errors.length ? 'error' : integrity.warnings.length ? 'warning' : 'ok';

     return {
       source: hasCanonical && hasLegacy ? 'mixed' : hasCanonical ? 'canonical' : 'legacy',
       session: bundle.session,
       modules,
       integrity,
       canonicalBundle: bundle
     }
   }

   async function ensureResultDataContext({ force = false } = {}) {
     if (RESULT_DATA_CONTEXT && !force) return RESULT_DATA_CONTEXT;
     if (RESULT_DATA_CONTEXT_PROMISE && !force) return RESULT_DATA_CONTEXT_PROMISE;
     RESULT_DATA_CONTEXT_PROMISE = loadResultDataContext()
       .then(context => {
         RESULT_DATA_CONTEXT = context;
         return context
       })
       .finally(() => {
         RESULT_DATA_CONTEXT_PROMISE = null
       });
     return RESULT_DATA_CONTEXT_PROMISE
   }

   // Numeric module scores remain available for research summaries only.
   // They must never determine the user-facing combined result.
   function moduleScore(d) {
     if (!d || typeof d !== 'object') return null;
     const raw = d.clinicalScore ?? d.score ?? d.researchSummary?.legacyScore;
     const value = Number(raw);
     return Number.isFinite(value) ? value : null
   }

   function moduleClass(d) {
     if (!d || typeof d !== 'object') return 'na';
     if (typeof d.validityStatus === 'string' && d.validityStatus !== 'valid') return 'na';
     if (['failed', 'error'].includes(d.technicalValidity)) return 'na';
     if (['technical_error', 'completed_invalid', 'aborted'].includes(d.attemptStatus)) return 'na';
     if (d.riskLevel === 'invalid') return 'na';

     const displayMap = {
       no_alert: 'ok',
       normal: 'ok',
       attention: 'warn',
       warning: 'warn',
       abnormal: 'bad'
     };
     const clinicalMap = {
       normal: 'ok',
       warning: 'warn',
       abnormal: 'bad'
     };

     if (displayMap[d.observationStatus]) return displayMap[d.observationStatus];
     if (displayMap[d.screeningDisplayStatus]) return displayMap[d.screeningDisplayStatus];
     if (displayMap[d.displayStatus]) return displayMap[d.displayStatus];
     if (clinicalMap[d.clinicalResult]) return clinicalMap[d.clinicalResult];
     if (['ok', 'warn', 'bad'].includes(d.riskLevel)) return d.riskLevel;
     if (typeof d.passed === 'boolean') return d.passed ? 'ok' : 'bad';

     return 'na'
   }

   function moduleIsUsable(d) {
     return moduleClass(d) !== 'na'
   }

   function moduleResearchScoreIsUsable(d) {
     if (!moduleIsUsable(d)) return false;
     if (d.scoreUsable === false) return false;
     return moduleScore(d) !== null
   }

   function requestedResultSource(data) {
     const querySource = QUERY_PARAMS.get('module');
     const storedSource = sessionStorage.getItem('fast_result_source');
     const explicitSource = MODULES.includes(querySource)
       ? querySource
       : MODULES.includes(storedSource)
         ? storedSource
         : null;

     if (explicitSource) return explicitSource;

     const mode = sessionStorage.getItem('fast_mode');
     const attempted = MODULES.filter(name => data[name]);
     if (mode === 'individual' && attempted.length === 1) return attempted[0];
     return null
   }

   function calculate() {
     const data = RESULT_DATA_CONTEXT?.modules || Object.fromEntries(
       MODULES.map(name => [name, readLegacyModule(name)])
     );
     const attempted = MODULES.filter(name => !!data[name]);
     const valid = MODULES.filter(name => moduleIsUsable(data[name]));
     const invalid = MODULES.filter(name => !!data[name] && !moduleIsUsable(data[name]));
     const missing = MODULES.filter(name => !data[name]);
     const bad = valid.filter(name => moduleClass(data[name]) === 'bad');
     const warn = valid.filter(name => moduleClass(data[name]) === 'warn');

     const researchScoreModules = valid.filter(name => moduleResearchScoreIsUsable(data[name]));
     let totalWeight = 0;
     let weightedSum = 0;
     researchScoreModules.forEach(name => {
       totalWeight += WEIGHTS[name];
       weightedSum += moduleScore(data[name]) * WEIGHTS[name]
     });
     const weighted = totalWeight > 0 ? Math.round(weightedSum / totalWeight) : null;

     const mode = sessionStorage.getItem('fast_mode') || RESULT_DATA_CONTEXT?.session?.sessionMode || 'full';
     const source = requestedResultSource(data);
     const scope = mode === 'individual' && source ? 'individual' : 'combined';
     let state;

     if (scope === 'individual') {
       const sourceData = data[source];
       const sourceClass = moduleClass(sourceData);
       if (!sourceData) state = 'noData';
       else if (sourceClass === 'na') state = 'incomplete';
       else if (sourceClass === 'bad') state = 'urgent';
       else if (sourceClass === 'warn') state = 'review';
       else state = 'ok'
     } else if (SINGLE_POSITIVE_OVERRIDE && bad.length) {
       state = 'urgent'
     } else if (!attempted.length) {
       state = 'noData'
     } else if (valid.length < 3) {
       state = 'incomplete'
     } else if (bad.length) {
       state = 'urgent'
     } else if (warn.length) {
       state = 'review'
     } else {
       state = 'ok'
     }

     return {
       data,
       attempted,
       valid,
       invalid,
       missing,
       bad,
       warn,
       weighted,
       researchScoreModules,
       mode,
       scope,
       source,
       state,
       attention: [...bad, ...warn].length,
       resultDataSource: RESULT_DATA_CONTEXT?.source || 'legacy',
       integrity: RESULT_DATA_CONTEXT?.integrity || null
     }
   }


   function emergencyPhone() {
     const emergencyConfig = window.QS_CONFIG?.emergency;
     const configured = emergencyConfig?.phone ||
       emergencyConfig?.[LANG] ||
       window.QS_CONFIG?.emergencyPhone;
     if (configured) {
       const number = String(configured).replace(/[^+\d]/g, '');
       if (number) return number
     }
     return LANG === 'th' ? '1669' : ''
   }

   function stateCopy(s) {
     return {
       noData: [T.stateNoDataTitle, T.stateNoDataDesc],
       incomplete: [T.stateIncompleteTitle, T.stateIncompleteDesc],
       ok: [T.stateOkTitle, T.stateOkDesc],
       review: [T.stateReviewTitle, T.stateReviewDesc],
       urgent: [T.stateUrgentTitle, T.stateUrgentDesc]
     } [s]
   }

   function individualSummaryCopy(r) {
     const moduleName = T[r.source];
     const title = T.individualResultTitle.replace('{module}', moduleName);
     const sourceData = r.data[r.source];
     const sourceClass = moduleClass(sourceData);

     let desc;

     if (!sourceData) {
       desc = T.individualNoDataDesc;
     } else if (sourceClass === 'na') {
       desc = T.individualInvalidDesc;
     } else if (sourceClass === 'ok') {
       desc = T.individualOkDesc;
     } else if (sourceClass === 'warn') {
       desc = T.individualReviewDesc;
     } else {
       desc = T.individualUrgentDesc;
     }

     return {
       title,
       desc,
       sourceClass,
       sourceData
     };
   }

   function renderSummary(r) {
     const card = document.getElementById('summary-card');
     const historicalModules = MODULES.filter(name => r.data[name]?.historicalAbnormalRetained === true);
     const showHistoricalWarning = historicalModules.length > 0 && r.state !== 'urgent';
     // Keep the latest measurement unchanged, but do not display a reassuring
     // green summary when this session previously contained a valid abnormal result.
     card.className = `summary-card ${showHistoricalWarning ? 'review' : r.state}`;

     const kicker = document.getElementById('summary-kicker');
     const titleElement = document.getElementById('summary-title');
     const descElement = document.getElementById('summary-desc');
     const value = document.getElementById('metric-value');
     const label = document.getElementById('metric-label');
     const completion = document.getElementById('completion');

     if (r.scope === 'individual') {
       const copy = individualSummaryCopy(r);

       kicker.textContent = T.individualKicker;
       titleElement.textContent = copy.title;
       descElement.textContent = showHistoricalWarning
         ? `${copy.desc} ${T.historicalAbnormalSummary || T.modulePriorAbnormal || 'A previous test in this session found an abnormal result.'}`
         : copy.desc;
       completion.hidden = true;

       if (!copy.sourceData) {
         value.textContent = '0/1';
         label.textContent = T.metricTested;
       } else if (copy.sourceClass === 'na') {
         value.textContent = '—';
         label.textContent = T.metricUnable;
       } else {
         value.textContent = copy.sourceClass === 'ok' ? '0/1' : '1/1';
         label.textContent = T.metricDetected;
       }
     } else {
       kicker.textContent = T.summaryKicker;

       const [title, desc] = stateCopy(r.state);
       titleElement.textContent = title;
       descElement.textContent = desc;
       if (showHistoricalWarning) {
         descElement.textContent = `${desc} ${T.historicalAbnormalSummary || 'A prior test in this session found an abnormal result.'}`;
       }

       const complete = r.valid.length === 3;
       const urgentPartial = r.state === 'urgent' && !complete;

       if (r.state === 'noData' || r.state === 'incomplete') {
         value.textContent = `${r.valid.length}/3`;
         label.textContent = T.metricTested;
         completion.hidden = true;
       } else {
         value.textContent = urgentPartial
           ? String(r.attention)
           : `${r.attention}/3`;
         label.textContent = T.metricDetected;
         completion.hidden = !urgentPartial;
         completion.textContent = T.completionShort.replace('{n}', r.valid.length);
       }
     }

     const emergency = document.getElementById('emergency-action');
     emergency.innerHTML = '';
     emergency.hidden = r.state !== 'urgent';

     if (r.state === 'urgent') {
       const phone = emergencyPhone();

       if (phone) {
         const button = document.createElement('button');
         button.type = 'button';
         button.className = 'emergency-call';
         button.innerHTML =
           '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2.1z"/></svg><span></span>';
         button.querySelector('span').textContent = T.emergencyThailand;
         button.onclick = () => {
           location.href = `tel:${phone}`;
         };
         emergency.appendChild(button);
       } else {
         const message = document.createElement('div');
         message.className = 'emergency-local';
         message.textContent = T.emergencyLocal;
         emergency.appendChild(message);
       }
     }
   }

   function moduleStatus(name, d) {
     if (!d) return {
       cls: 'na',
       text: T.notTested,
       action: T.startModule,
       actionable: true
     };
     if (!moduleIsUsable(d)) return {
       cls: 'na',
       text: T.invalidStatus,
       action: T.retryModule,
       actionable: true
     };
     const cls = moduleClass(d);
     return {
       cls: d.historicalAbnormalRetained && cls === 'ok' ? 'warn' : cls,
       text: d.historicalAbnormalRetained
         ? (T.modulePriorAbnormal || T.moduleBad)
         : cls === 'ok' ? T.moduleOk : cls === 'warn' ? T.moduleReview : T.moduleBad,
       action: T.retryModule,
       actionable: true
     }
   }

   function renderModules(r) {
     const grid = document.getElementById('module-grid');
     grid.innerHTML = '';
     // Public Mode keeps only ephemeral in-session safety history. Recording it
     // here preserves a prior valid abnormal across later retries without
     // changing the frozen result-calculation logic.
     if (isPublicResultSession() && r?.data) {
       MODULES.forEach(name => rememberPublicAbnormal(name, r.data[name]));
     }
     MODULES.forEach(name => {
       const s = moduleStatus(name, r.data[name]);
       const el = document.createElement('div');
       const currentClass = r.scope === 'individual' && r.source === name
         ? ' current'
         : '';
       el.className = `module-tile ${s.cls}${currentClass}`;
       el.innerHTML =
         `<div class="module-icon">${ICONS[name]}</div><div class="module-name"></div><div class="module-status"></div><div class="module-action"></div>`;
       el.querySelector('.module-name').textContent = T[name];
       el.querySelector('.module-status').textContent = s.text;
       const retryAllowed = canRetryModule(name);
       if (s.actionable && retryAllowed) {
         el.setAttribute('role', 'button');
         el.tabIndex = 0;
         el.querySelector('.module-action').textContent = isDevResultSession() && r.state === 'urgent'
           ? `DEV · ${s.action}`
           : s.action;
         const go = () => retryModule(name);
         el.onclick = go;
         el.onkeydown = e => {
           if (e.key === 'Enter' || e.key === ' ') {
             e.preventDefault();
             go()
           }
         };
         el.setAttribute('aria-label', `${T[name]} · ${s.text} · ${s.action}`)
       }
       grid.appendChild(el)
     })
   }

   function renderNext(r) {
     const element = document.getElementById('next-step');

     if (r.scope === 'individual') {
       element.textContent = T.individualNotCombined;
     } else {
       const messages = {
         noData: T.nextNoData,
         incomplete: T.nextIncomplete,
         ok: T.nextOk,
         review: T.nextReview,
         urgent: T.nextUrgent
       };
       element.textContent = messages[r.state];
     }

     element.className = `next-step ${
       r.state === 'urgent'
         ? 'urgent'
         : r.state === 'review'
           ? 'review'
           : ''
     }`.trim();
   }

   function renderReminder(r) {
     const el = document.getElementById('emergency-reminder');
     if (r.state === 'urgent') {
       el.hidden = true;
       return
     }
     el.hidden = false;
     el.innerHTML = '';
     const span = document.createElement('span');
     span.textContent = LANG === 'th' ? T.emergencyReminderThailand : T.emergencyReminderLocal;
     el.appendChild(span);
     const phone = emergencyPhone();
     if (phone) {
       const b = document.createElement('button');
       b.type = 'button';
       b.textContent = '1669';
       b.onclick = () => location.href = `tel:${phone}`;
       el.appendChild(b)
     }
   }

   function appendTechnicalRow(grid, label, value) {
     const dt = document.createElement('dt');
     const dd = document.createElement('dd');
     dt.textContent = label;
     dd.textContent = value;
     grid.append(dt, dd)
   }

   function technicalValidityText(d) {
     if (!d) return '—';
     if (d.technicalValidity === 'degraded') return T.technicalDegraded;
     if (['failed', 'error'].includes(d.technicalValidity)) return T.technicalError;
     if (d.technicalValidity === 'invalid') return T.validityInvalid;
     if (d.technicalValidity === 'not_assessed') return '—';
     return T.technicalFull
   }

   function renderResearch(r) {
     const panel = document.getElementById('research-panel');
     panel.hidden = !isDetailResultSession();
     if (!isDetailResultSession()) return;
     document.getElementById('technical-title').textContent = T.technicalTitle;
     document.getElementById('technical-disclaimer').textContent = T.technicalDisclaimer;
     const grid = document.getElementById('technical-grid');
     grid.innerHTML = '';

     MODULES.forEach(name => {
       const d = r.data[name];
       const usable = moduleIsUsable(d);
       const researchScore = moduleScore(d);
       appendTechnicalRow(
         grid,
         T.moduleScore.replace('{module}', T[name]),
         usable && researchScore !== null ? String(researchScore) : '—'
       );
       appendTechnicalRow(
         grid,
         T.moduleValidity.replace('{module}', T[name]),
         d ? (usable ? T.validityValid : T.validityInvalid) : '—'
       );

       if (d) {
         appendTechnicalRow(
           grid,
           T.moduleTechnicalValidity.replace('{module}', T[name]),
           technicalValidityText(d)
         );

         if (!usable && d.invalidReasonCode) {
           appendTechnicalRow(
             grid,
             `${T[name]} · ${T.invalidReason}`,
             String(d.invalidReasonCode)
           )
         }

         const flags = Array.isArray(d.qualityFlags)
           ? d.qualityFlags
           : (Array.isArray(d.runtime?.qualityFlags) ? d.runtime.qualityFlags : []);
         if (flags.length) {
           appendTechnicalRow(
             grid,
             `${T[name]} · ${T.qualityFlags}`,
             flags.join(', ')
           )
         }
       }
     });

     appendTechnicalRow(
       grid,
       T.internalWeightedScore,
       r.weighted === null ? '—' :
         `${r.weighted} · ${T.basedOn.replace('{n}',r.researchScoreModules.length)}`
     )
   }

   function diagnosticQualityFlags(d) {
     if (!d || typeof d !== 'object') return [];
     if (Array.isArray(d.qualityFlags)) return d.qualityFlags.map(String);
     if (Array.isArray(d.runtime?.qualityFlags)) return d.runtime.qualityFlags.map(String);
     return []
   }

   function moduleDiagnostic(name, d) {
     if (!d || typeof d !== 'object') {
       return {
         module: name,
         dataSource: RESULT_DATA_CONTEXT?.integrity?.moduleSources?.[name] || 'missing',
         present: false,
         derivedClass: 'na',
         userFacingUsable: false,
         researchScoreUsable: false
       }
     }

     const versions = d.versions && typeof d.versions === 'object'
       ? d.versions
       : {
           moduleVersion: d.moduleVersion ?? null,
           algorithmVersion: d.algorithmVersion ?? null,
           resultSchemaVersion: d.resultSchemaVersion ?? d.schemaVersion ?? null,
           researchPayloadVersion: d.researchPayloadVersion ?? null
         };

     return {
       module: name,
       dataSource: d.resultDataSource || RESULT_DATA_CONTEXT?.integrity?.moduleSources?.[name] || 'unknown',
       present: true,
       identity: {
         participantId: d.screeningContext?.participantId ?? d.participantId ?? null,
         screeningSessionId: d.screeningContext?.screeningSessionId ?? d.screeningSessionId ?? null,
         moduleRunId: d.moduleRunId ?? null,
         selectedTestAttemptId: d.selectedTestAttemptId ?? d.testAttemptId ?? d.attemptId ?? null,
         selectedTestAttemptIds: d.selectedTestAttemptIds ?? null,
         attemptSequenceNo: d.attemptSequenceNo ?? null,
         attemptTrigger: d.attemptTrigger ?? null
       },
       timing: {
         startedAt: d.startedAt ?? d.startedAtUtc ?? null,
         completedAt: d.completedAt ?? d.endedAtUtc ?? null
       },
       statusFields: {
         observationStatus: d.observationStatus ?? null,
         latestObservationStatus: d.latestObservationStatus ?? null,
         historicalAbnormalRetained: d.historicalAbnormalRetained === true,
         abnormalHistoryCount: d.abnormalHistoryCount ?? 0,
         validityStatus: d.validityStatus ?? null,
         technicalValidity: d.technicalValidity ?? null,
         qualityStatus: d.qualityStatus ?? null,
         invalidReasonCode: d.invalidReasonCode ?? d.invalidReason ?? null
       },
       scoreFieldsResearchOnly: {
         selectedNumericScore: moduleScore(d),
         scoreUsableFlag: d.scoreUsable ?? null
       },
       domainSummary: d.domainSummary ?? null,
       derivedClass: moduleClass(d),
       userFacingUsable: moduleIsUsable(d),
       researchScoreUsable: moduleResearchScoreIsUsable(d),
       qualityFlags: diagnosticQualityFlags(d),
       versions
     }
   }


   function decisionRuleApplied(r) {
     if (r.scope === 'individual') {
       const sourceData = r.data[r.source];
       const sourceClass = moduleClass(sourceData);
       if (!sourceData) return 'individual:no_data';
       if (sourceClass === 'na') return 'individual:invalid_or_unusable';
       if (sourceClass === 'bad') return 'individual:categorical_abnormal';
       if (sourceClass === 'warn') return 'individual:categorical_warning';
       return 'individual:categorical_normal'
     }

     if (SINGLE_POSITIVE_OVERRIDE && r.bad.length) {
       return 'combined:single_positive_override_categorical_abnormal'
     }
     if (!r.attempted.length) return 'combined:no_data';
     if (r.valid.length < MODULES.length) return 'combined:incomplete';
     if (r.bad.length) return 'combined:categorical_abnormal';
     if (r.warn.length) return 'combined:categorical_warning';
     return 'combined:all_categorical_normal'
   }

   function buildDecisionTrace(r) {
     return {
       policyVersion: window.QS_CONFIG?.resultPolicy?.version || 'result-policy-1.1.0',
       decisionBasis: window.QS_CONFIG?.resultPolicy?.combinedDecisionBasis || 'categorical_module_status_only',
       dataSource: r.resultDataSource,
       attemptedModules: [...r.attempted],
       validModules: [...r.valid],
       invalidModules: [...r.invalid],
       missingModules: [...r.missing],
       abnormalModules: [...r.bad],
       historicalAbnormalRetainedModules: MODULES.filter(name => r.data[name]?.historicalAbnormalRetained === true),
       devUrgentRetryControlsEnabled: isDevResultSession() && r.state === 'urgent',
       warningModules: [...r.warn],
       scope: r.scope,
       sourceModule: r.source,
       finalUserFacingState: r.state,
       ruleApplied: decisionRuleApplied(r),
       weightedScoreUsedForUserFacingDecision: false,
       selectedModuleRuns: Object.fromEntries(MODULES.map(name => [
         name,
         r.data[name]?.moduleRunId || null
       ])),
       selectedAttempts: Object.fromEntries(MODULES.map(name => [
         name,
         r.data[name]?.selectedTestAttemptIds || r.data[name]?.selectedTestAttemptId || null

   async function copyText(text) {
     if (navigator.clipboard?.writeText && window.isSecureContext) {
       await navigator.clipboard.writeText(text);
       return
     }

     const textarea = document.createElement('textarea');
     textarea.value = text;
     textarea.setAttribute('readonly', '');
     textarea.style.position = 'fixed';
     textarea.style.opacity = '0';
     document.body.appendChild(textarea);
     textarea.select();
     const copied = document.execCommand('copy');
     textarea.remove();
     if (!copied) throw new Error('copy-command-failed')
   }

   function action(button, label, handler, hidden = false) {
     button.hidden = hidden;
     button.textContent = label;
     button.onclick = hidden ? null : handler

   function researchProtocolSelectionStatus(name) {
     const selection = RESULT_DATA_CONTEXT?.session?.moduleSelection?.[name] || null;
     const configuredLimit = Number(
       selection?.protocolSelectionRunLimit ??
       selection?.protocolRetryLimit ??
       window.QS_CONFIG?.research?.retryLimits?.[name]?.maxProtocolModuleRuns ??
       2
     );
     const latestSequence = Number(
       selection?.latestModuleRunId && CURRENT?.data?.[name]?.moduleRunSequenceNo
         ? CURRENT.data[name].moduleRunSequenceNo
         : CURRENT?.data?.[name]?.moduleRunSequenceNo || 0
     );
     const nextSequence = Math.max(1, latestSequence + 1);
     return {
       configuredLimit,
       nextSequence,
       protocolSelectionEligible: nextSequence <= configuredLimit,
       protocolPhase: nextSequence <= 1
         ? 'initial_protocol'
         : nextSequence <= configuredLimit
           ? 'protocol_retry'
           : 'post_protocol_repeatability'
     };
   }

   function canRetryModule(name) {
     if (!MODULES.includes(name)) return false;
     const sessionStatus = RESULT_DATA_CONTEXT?.session?.sessionStatus || RESULT_CONTRACT?.getSessionContext?.()?.sessionStatus;
     // Retry execution is allowed in Public, Research and Dev until finalization.
     // In Research, the protocol run limit controls selection eligibility only;
     // runs beyond that limit remain available as post-protocol repeatability runs.
     return sessionStatus !== 'finalized';
   }

   function renderActions(r) {
     const primary = document.getElementById('primary-action');
     const secondary = document.getElementById('secondary-action');
     const retry = document.getElementById('retry-all');

     if (r.scope === 'individual') {
       const sourceData = r.data[r.source];
       const sourceClass = moduleClass(sourceData);
       const hasRemaining = r.invalid.length > 0 || r.missing.length > 0;

       if (!sourceData || sourceClass === 'na') {
         action(primary, T.retryCurrent, () => retryModule(r.source));
         action(secondary, T.home, goHome);
         action(retry, '', null, true);
       } else if (r.state === 'urgent') {
         action(primary, T.home, goHome);
         if (canRetryModule(r.source)) {
           action(secondary, T.retryCurrent, () => retryModule(r.source));
         } else {
           action(secondary, '', null, true);
         }
         action(retry, '', null, true);
       } else if (hasRemaining) {
         action(primary, T.checkRemaining, continueTests);
         action(secondary, T.home, goHome);
         action(retry, T.retryCurrent, () => retryModule(r.source), false);
       } else {
         action(primary, T.home, goHome);
         action(secondary, T.retryCurrent, () => retryModule(r.source));
         action(retry, '', null, true);
       }
     } else if (r.state === 'noData') {
       action(primary, T.startTests, continueTests);
       action(secondary, T.home, goHome);
       action(retry, '', null, true);
     } else if (r.state === 'incomplete') {
       action(primary, T.continueTests, continueTests);
       action(secondary, T.home, goHome);
       action(retry, T.retryAll, retryAll, false);
     } else if (r.state === 'urgent') {
       action(primary, T.home, goHome);
       const retryableAbnormalModule = (r.bad || []).find(name => canRetryModule(name));
       if (retryableAbnormalModule) {
         action(secondary, T.retryCurrent, () => retryModule(retryableAbnormalModule));
       } else {
         action(secondary, '', null, true);
       }
       action(retry, '', null, true);
     } else {
       action(primary, T.home, goHome);
       action(secondary, T.retryAll, retryAll);
       action(retry, '', null, true);
     }

     const sessionStatus = RESULT_DATA_CONTEXT?.session?.sessionStatus || RESULT_CONTRACT?.getSessionContext?.()?.sessionStatus;
     if (isResearchResultSession()) {
       // Research uses per-module retry plus explicit finalization. Hide the
       // generic "retry all / start over" action so an operator cannot
       // accidentally abandon a participant before finalization.
       action(retry, '', null, true);
       if (r.scope !== 'individual') {
         action(primary, T.home || 'กลับหน้าหลัก', goHome);
         action(secondary, '', null, true);
       }
       if (sessionStatus === 'finalized') {
         action(primary, T.home || 'กลับหน้าหลัก', goHome);
         action(secondary, '', null, true);
       }
     }
     document.getElementById('legal-note').textContent = T.safetyNote;
   }

   function safeFilenamePart(value) {
     return String(value || 'session').replace(/[^a-zA-Z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'session';

   async function exportCurrentResearchSession() {
     const status = document.getElementById('finalization-status');
     const button = document.getElementById('export-research-session');
     const sessionId = RESULT_DATA_CONTEXT?.session?.screeningSessionId || currentSessionIdentity().screeningSessionId;
     if (!RESULT_RESEARCH_STORE?.exportSession || !sessionId) return;
     button.disabled = true;
     if (status) status.textContent = 'กำลังเตรียมไฟล์ส่งออก…';
     try {
       const payload = await RESULT_RESEARCH_STORE.exportSession(sessionId);
       const studyId = payload?.screeningSession?.researchMetadata?.studyId || 'QuickStroke';
       const filename = `${safeFilenamePart(studyId)}-${safeFilenamePart(sessionId)}-1.0.21.json`;
       const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json;charset=utf-8' });
       const file = typeof File === 'function' ? new File([blob], filename, { type:blob.type }) : null;
       let exportMethod = 'download';
       if (file && navigator.share && navigator.canShare?.({ files:[file] })) {
         await navigator.share({ files:[file], title:'QuickStroke research session' });
         exportMethod = 'web_share';
         if (status) status.textContent = `ส่งออกแล้ว: ${filename}`;
       } else {
         const url = URL.createObjectURL(blob);
         const link = document.createElement('a');
         link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
         setTimeout(() => URL.revokeObjectURL(url), 1500);
         if (status) status.textContent = `ดาวน์โหลดแล้ว: ${filename}`;
       }
       try {
         await RESULT_RESEARCH_STORE.addAuditEvent?.(sessionId, 'SESSION_EXPORTED_LOCALLY', {
           reasonCode:'LOCAL_RESEARCH_EXPORT',
           details:{ filename, exportMethod, exportedAt:new Date().toISOString() }
         });
       } catch (auditError) {
         console.warn('Research export succeeded but export audit event could not be stored.', auditError);
         if (status) status.textContent += ' · คำเตือน: บันทึก audit event ไม่สำเร็จ';
       }
     } catch (error) {
       if (error?.name === 'AbortError') {
         if (status) status.textContent = 'ยกเลิกการส่งออก';
       } else {
         console.error('Research export failed.', error);
         if (status) status.textContent = `ส่งออกไม่สำเร็จ: ${error.message || error}`;
       }
     } finally { button.disabled = false; }
   }

     const studyId = session.researchMetadata?.studyId || '—';
     meta.textContent = `Study ID: ${studyId} · Profile: ${session.researchProfile || 'clinic_supervised'} · Upload: ${session.uploadState || 'not_configured'} · Export: ${session.exportState || 'not_exported'}`;
     badge.textContent = String(session.sessionStatus || 'active').toUpperCase();
     if (session.sessionStatus === 'finalized') {
       box.className = 'integrity-box ok';
